# pyproject.toml

[build-system]
requires = ["setuptools>=77.0.0", "setuptools_scm[toml]>=6.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raddb"
description = "Generic radar data archiving library — archive xarray DataTree volumes as Parquet"
readme = "README.md"
authors = [
	{ name = "Andrea Giacobbi" },
	{ name = "Gionata Ghiggi" },
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
keywords = ["Weather", "Radar", "Precipitation", "Parquet", "DataTree", "Archive"]
dependencies = [
    "numpy",
    "pandas",
    "polars",
    "geopandas",
    "shapely>=2.0",
    "pyproj>=3.0",
    "xarray",
    "pyyaml",
    "pyarrow",
    "matplotlib",
    "netcdf4",
    "zarr",
]
requires-python = ">=3.11"
# version="0.0.1"
dynamic = ["version"]

[tool.setuptools.packages.find]
include = ["raddb*"]
# raddb.mch is a private, out-of-tree ingestion subpackage (gitignored, kept in
# its own repo) — excluded here as defense in depth for wheels built from a
# checkout that has it present locally.
exclude = ["raddb.mch*", "raddb.tests*"]

[tool.setuptools_scm]
write_to = "raddb/_version.py"

[project.optional-dependencies]
viz = ["cartopy>=0.22", "lonboard>=0.10", "geoarrow-pyarrow>=0.2",
       "ipyleaflet>=0.18", "ipywidgets>=8.0"]
io = ["pyshp"]  # reading .shp areas of interest
dev = ["pre-commit", "loghub",
       "black[jupyter]", "blackdoc", "codespell", "ruff",
       "pytest", "pytest-cov", "pytest-check", "pytest-sugar",
       "pytest-watcher",
       "pip-tools", "twine", "wheel", "build", "setuptools>=77.0.0",
       "sphinx", "sphinx-gallery", "sphinx-book-theme", "nbsphinx", "sphinx_mdinclude",
       "sphinxcontrib-youtube"]

[project.urls]
homepage = "https://github.com/ltelab/raddb"
repository = "https://github.com/ltelab/raddb"
source = "https://github.com/ltelab/raddb"
tracker = "https://github.com/ltelab/raddb/issues"
documentation = "https://raddb.readthedocs.io"

[tool.pytest.ini_options]
minversion = "7"
addopts = "-ra --strict-config --strict-markers --cov --cov-report term-missing --cov-report xml --cov-report lcov:lcov.info --check-max-report=10"
xfail_strict = true
# filterwarnings = ["error"]
log_cli_level = "info"
testpaths = [
  "raddb/tests",
]

[tool.black]
line-length = 120
# skip-string-normalization = true
target-version = [
    "py311",
    "py312",
    "py313",
]

[tool.ruff]
line-length = 120
indent-width = 4

# Addional file to be formatted by ruff (in addition to *py)
extend-include = ["*.ipynb"]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "docs",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.format]
# Enable reformatting of code snippets in docstrings.
docstring-code-format = true

[tool.ruff.lint]
select = [
    # pydocstyle
    "D",
    # Pyflakes
    "F",
    # pycodestyle
    "E",
    "W",
    # isort
    "I",
    # pyupgrade
    "UP",
    # flake8-quotes
    "Q",
    # flake8-bugbear
    "B",
    # flake8-return
    "RET",
    # flake8-unused-arguments
    "ARG",
    # flake8-raise
    "RSE",
    # flake8-pytest-style
    "PT",
    # flake8-simplify
    "SIM",
    # Perflint
    "PERF",
    # pandas-vet
    "PD",
    # pylint
    "PL",
    # flake8-commas
    "COM",
    # flake8-slots
    "SLOT",
    # flake8-comprehensions
    "C4",
    # Ruff custom rules
    "RUF",
    # NumPy-specific rules  (for 2.0)
    "NPY",
    #---------------------
    #### Future rules ####
    # flake8-use-pathlib
    # "PTH",
    # refurb
    # "FURB", # require preview

]
ignore = [
    "E722",
    "B904",
    "B006", # {} defaults in function arguments
    "PT011", # pytest raised error must be checked if match the expected error msg
    "PERF203",
    "UP038",
    # "PD011", # suggest values --> to_numpy
    "PD901",
    "PD013", # suggest melt instead of stack
    "PLW2901",
    "PLW0603",
    "RUF012",
    "RUF015",
    "RET504",
    # Docstyle Rules
    "D404", # Docstring can't start with "This"
    "D401", # First sentence must be in imperative mood
    "D100",
    # "D101","D102", "D103", "D104", "D105",  # Missing docstrings
    # Complexity rules
    "PLR0913", # restrict max number of function argument
    "PLR2004",
    "PLR0912",
    "PLR0915",
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Ignore `E402` (import violations) in all Jupyter Notebooks.
"*.ipynb" = ["E402"]
# Rules to ignore in test files
"test_*.py" = [
    "ARG",  # avoid problems with fixtures
    "D100", "D101","D102", "D103", "D104", "D105",  # Missing docstrings
]
"setup.py" = ["D100"]
"*__init__.py" = ["D104"]

[tool.codespell]
ignore-words-list = "ges,nd"
